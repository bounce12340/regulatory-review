name: Cloudflare site — checks

on:
  push:
    branches: [main]
    paths: ["cloudflare/**", "config/regulatory_schemas.yaml", ".github/workflows/cloudflare.yml"]
  pull_request:
    paths: ["cloudflare/**", "config/regulatory_schemas.yaml", ".github/workflows/cloudflare.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (incl. schema ↔ YAML consistency)
        run: npm test

      - name: API end-to-end tests (local Worker + local D1 + mock AI)
        run: |
          npx wrangler d1 migrations apply regulatory-review --local
          node test/mock-ollama.mjs &
          printf 'OLLAMA_API_KEY=test-key\nAI_BASE_URL=http://127.0.0.1:8788\n' > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          MOCK_OLLAMA_URL=http://127.0.0.1:8788 npm run test:e2e || (cat wrangler.log; exit 1)
